<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Titanic model output example">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08131f"/>
      <stop offset="100%" stop-color="#06101a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102236"/>
      <stop offset="100%" stop-color="#0b1726"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#32d296"/>
      <stop offset="100%" stop-color="#8bffcf"/>
    </linearGradient>
    <style>
      .title{font:700 40px 'Segoe UI',Arial,sans-serif; fill:#edf3f8}
      .sub{font:500 18px 'Segoe UI',Arial,sans-serif; fill:#9fb0c3}
      .label{font:700 16px 'Segoe UI',Arial,sans-serif; fill:#9fb0c3; text-transform:uppercase; letter-spacing:1px}
      .value{font:700 26px 'Segoe UI',Arial,sans-serif; fill:#edf3f8}
      .metric{font:800 54px 'Segoe UI',Arial,sans-serif; fill:#edf3f8}
      .muted{font:500 17px 'Segoe UI',Arial,sans-serif; fill:#c6d2dd}
      .small{font:500 15px 'Segoe UI',Arial,sans-serif; fill:#9fb0c3}
    </style>
  </defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <circle cx="1060" cy="110" r="90" fill="#6fd1ff" opacity="0.14"/>
  <circle cx="160" cy="90" r="120" fill="#8bffcf" opacity="0.10"/>

  <text x="70" y="88" class="title">Titanic Model Output</text>
  <text x="70" y="122" class="sub">Sample passenger prediction generated from titanic_model.json</text>

  <rect x="70" y="170" width="1060" height="470" rx="28" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.10"/>

  <g transform="translate(110 225)">
    <text x="0" y="0" class="label">Sample input</text>
    <text x="0" y="54" class="muted">Class: 1st</text>
    <text x="0" y="88" class="muted">Sex: female</text>
    <text x="0" y="122" class="muted">Age: 26</text>
    <text x="0" y="156" class="muted">Fare: 80</text>
    <text x="0" y="190" class="muted">Siblings / spouses: 1</text>
    <text x="0" y="224" class="muted">Parents / children: 0</text>
    <text x="0" y="258" class="muted">Embarked: Cherbourg</text>
  </g>

  <g transform="translate(430 225)">
    <text x="0" y="0" class="label">Prediction</text>
    <text x="0" y="78" class="metric">71.0%</text>
    <text x="0" y="118" class="value">Survived</text>
    <text x="0" y="156" class="small">Probability of survival for this sample passenger</text>
    <rect x="0" y="204" width="390" height="18" rx="9" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="0" y="204" width="277" height="18" rx="9" fill="url(#bar)"/>
  </g>

  <g transform="translate(860 225)">
    <text x="0" y="0" class="label">Model stats</text>
    <text x="0" y="56" class="muted">Accuracy: 79.3%</text>
    <text x="0" y="90" class="muted">ROC-AUC: 0.723</text>
    <text x="0" y="124" class="muted">Features: 11</text>
    <text x="0" y="158" class="muted">Train samples: 712</text>
    <text x="0" y="192" class="muted">Test samples: 179</text>
  </g>
</svg>
